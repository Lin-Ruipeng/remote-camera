[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-camera"
version = "0.1.0"
description = "USB Android webcam and CUDA human pose viewer"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5,!=4.13.0.90",
  "PySide6>=6.8,<7",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "ultralytics-opencv-headless==8.4.175",
]

[project.scripts]
remote-camera = "remote_camera.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
